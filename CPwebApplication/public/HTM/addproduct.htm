
<div id="productdiv">
    <div id="prdivitem">
        <div>
            <label for="">Product Name</label>
            <input type="text" id="product_name">
        </div>
         <div>
            <label for="">Product Code</label>
            <input type="text" id="product_code">
        </div>
         <div>
            <label for="">Product Category</label>
            <select name="value" id="P_category">
                <option value="">Please select category</option>
                <option value="HDPE Bottle">HDPE Bottle</option>
                <option value="PP CRC">PP CRC</option>
                <option value="PP CTC">PP CTC</option>
                <option value="HDPE Canister">HDPE Canister</option>
                <option value="HDPE Desiccant Canister">HDPE Desiccant Canister</option>
                <option value="LDPE Poly Bag">LDPE Poly Bag</option>
                <option value="LLDPE Poly Bag">LLDPE Poly Bag</option>
                <option value="LDPE Ziploc">LDPE Ziploc</option>
                <option value="LLDPE Ziploc">LLDPE Ziploc</option>
            </select>
        </div>
        <div>
            <form action="" method="post" enctype="multipart/form-data">
                Upload the product images:
                <input type="file" name="productimages" id="">
                <input type="button" value="File Upload" onclick="uploadimage()">
            </form>
            <div id="uploadmsg">your file has been successfully uploaded.</div>
            <div id="uploadmsg2">Please upload image file only</div>
        </div>
       
        <div>
            <button onclick="addnewproduct()">Submit</button>
            <button>Clear</button>
        </div> 
    </div>
</div>
