<div class="batchtemplet">
    <div>
        <div>
            <label for="">Enter Product Name: </label>
            <input type="text" id="Productname">
        </div>
        <div>
            <label for="">Enter Product Code: </label>
            <input type="text" id="Productcode">
        </div>
         <div>
            <label for="">Enter Resin: </label>
            <input type="text" id="Resin">
        </div>
        <div>
            <label for="">Enter Colorant: </label>
            <input type="text" id="Colourant">
        </div>
        <div>
            <label for="">Enter Batch Size: </label>
            <input type="number" id="Batchsize">
        </div>
        <div>
            <label for="">Enter Batch Number: </label>
            <input type="text" id="Batchnumber">
        </div>
        <div>
            <label for="">DMF OR NON-DMF</label>
            <select name="value" id="DMF-NONDMF">
                <option value="">Please select category</option>                        
                <option value="DMF">DMF</option>
                <option value="NON-DMF">NON-DMF</option>                
            </select>
        </div>
        <div>
            <label for="">Select Product Catagory</label>
            <select name="value" id="P_category">
                <option value="">Please select category</option>
                <option value="HDPE Bottle">HDPE Bottle</option>
                <option value="PP CRC">PP CRC</option>
                <option value="PP CTC">PP CTC</option>
                <option value="HDPE Canister">HDPE Canister</option>
                <option value="HDPE Desiccant Canister">HDPE Desiccant Canister</option>
                <option value="LDPE Poly Bag">LDPE Poly Bag</option>
                <option value="LLDPE Poly Bag">LLDPE Poly Bag</option>
                <option value="LDPE Ziploc">LDPE Ziploc</option>
                <option value="LLDPE Ziploc">LLDPE Ziploc</option>
            </select>
        </div>
    </div>
    <div>
        <button onclick="addbatchdetails()">Submit</button>
    </div>
</div>
